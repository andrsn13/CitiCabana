<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookings - Citi Cabana Admin</title>
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <div class="admin-brand">Citi Cabana</div>
        <ul class="admin-nav">
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="bookings.html" class="active">Bookings</a></li>
          <li><a href="room-status.html">Room Status</a></li>
          <li><a href="reports.html">Reports</a></li>
          <li
            style="
              margin-top: 15px;
              font-size: 0.8em;
              text-transform: uppercase;
              color: #888;
              padding-left: 15px;
            "
          >
            Content
          </li>
          <li><a href="cms.html">Manage Website</a></li>
          <li style="margin-top: 30px">
            <a href="#" onclick="logout()">Logout</a>
          </li>
        </ul>
      </aside>

      <main class="admin-content">
        <div class="page-header">
          <h1>Bookings</h1>
          <a
            href="#add-booking"
            class="btn btn-success"
            onclick="toggleAddWalkin()"
            >+ Add Walk-in / Phone Booking</a
          >
        </div>

        <!-- Add Walk-in Form (Hidden by default) -->
        <div
          id="add-walkin-container"
          class="card"
          style="display: none; margin-bottom: 30px; background: #eef2f5"
        >
          <h2>Log Manual Booking</h2>
          <form id="add-walkin-form">
            <div class="detail-grid">
              <div class="form-group">
                <label>Booking Type</label>
                <select
                  id="walkin-type"
                  required
                  onchange="toggleWalkinFields()"
                >
                  <option value="room">Room</option>
                  <option value="event">Event</option>
                </select>
              </div>
              <div class="form-group">
                <label>Guest Name</label>
                <input type="text" id="walkin-name" required />
              </div>
              <div class="form-group">
                <label>Email (optional; required to email confirmation)</label>
                <input type="email" id="walkin-email" maxlength="254" />
              </div>
            </div>

            <!-- Room fields -->
            <div id="walkin-room-fields" class="detail-grid">
              <div class="form-group">
                <label for="walkin-room-type">Room Type</label>
                <select id="walkin-room-type" required>
                  <option value="">Loading room types...</option>
                </select>
              </div>
              <div class="form-group">
                <label>Check-in</label><input type="date" id="walkin-checkin" />
              </div>
              <div class="form-group">
                <label>Check-out</label
                ><input type="date" id="walkin-checkout" />
              </div>
            </div>

            <!-- Event fields -->
            <div
              id="walkin-event-fields"
              class="detail-grid"
              style="display: none"
            >
              <div class="form-group">
                <label>Event Type</label
                ><input type="text" id="walkin-event-type" />
              </div>
              <div class="form-group">
                <label>Event Date</label
                ><input type="date" id="walkin-event-date" />
              </div>
            </div>

            <button type="submit" class="btn btn-primary">Save Booking</button>
            <button
              type="button"
              class="btn btn-outline"
              onclick="toggleAddWalkin()"
            >
              Cancel
            </button>
          </form>
        </div>

        <nav class="booking-tabs" aria-label="Booking views" role="tablist">
          <button type="button" class="booking-tab active" data-booking-tab="needs-action" role="tab" aria-selected="true">Needs action <span id="count-needs-action" class="booking-tab-count">0</span></button>
          <button type="button" class="booking-tab" data-booking-tab="today" role="tab" aria-selected="false">Today <span id="count-today" class="booking-tab-count">0</span></button>
          <button type="button" class="booking-tab" data-booking-tab="in-house" role="tab" aria-selected="false">In-house <span id="count-in-house" class="booking-tab-count">0</span></button>
          <button type="button" class="booking-tab" data-booking-tab="upcoming" role="tab" aria-selected="false">Upcoming <span id="count-upcoming" class="booking-tab-count">0</span></button>
          <button type="button" class="booking-tab" data-booking-tab="past" role="tab" aria-selected="false">Past <span id="count-past" class="booking-tab-count">0</span></button>
          <button type="button" class="booking-tab" data-booking-tab="cancelled" role="tab" aria-selected="false">Cancelled <span id="count-cancelled" class="booking-tab-count">0</span></button>
          <button type="button" class="booking-tab" data-booking-tab="all" role="tab" aria-selected="false">All <span id="count-all" class="booking-tab-count">0</span></button>
        </nav>

        <div class="card booking-list-card">
          <div class="booking-filters" role="search">
            <label class="booking-search-label" for="booking-search">Search</label>
            <input id="booking-search" type="search" placeholder="Guest, email, or booking ID" />
            <label for="filter-type">Type</label>
            <select id="filter-type">
              <option value="all">All</option>
              <option value="room">Room</option>
              <option value="villa">Villa</option>
              <option value="event">Event</option>
            </select>
            <label for="filter-start">Stay overlaps</label>
            <input id="filter-start" type="date" aria-label="Date range start" />
            <span aria-hidden="true">to</span>
            <input id="filter-end" type="date" aria-label="Date range end" />
            <label id="filter-status-label" for="filter-status" hidden>Status</label>
            <select id="filter-status" hidden>
              <option value="All">All statuses</option>
              <option value="Pending">Pending</option>
              <option value="Confirmed">Confirmed</option>
              <option value="CheckedIn">Checked in</option>
              <option value="CheckedOut">Checked out</option>
              <option value="Rejected">Rejected</option>
              <option value="Cancelled">Cancelled</option>
              <option value="NoShow">No-show</option>
            </select>
            <button type="button" id="clear-booking-filters" class="booking-clear">Clear</button>
          </div>
          <p id="booking-list-error" class="error-msg" role="alert"></p>
          <div id="booking-sections"></div>
          <div class="table-responsive">
            <table id="bookings-table">
              <thead>
                <tr>
                  <th>Guest</th>
                  <th>Stay</th>
                  <th>Unit</th>
                  <th>Status</th>
                  <th>Placed</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="bookings-tbody">
                <tr><td colspan="6" class="text-center">Loading bookings...</td></tr>
              </tbody>
            </table>
          </div>
          <div class="booking-pagination">
            <span id="booking-page-summary" aria-live="polite"></span>
            <button type="button" id="booking-page-previous" class="btn btn-outline">Previous</button>
            <button type="button" id="booking-page-next" class="btn btn-outline">Next</button>
          </div>
        </div>

        <div id="booking-toast" class="booking-toast" role="status" aria-live="polite" hidden>
          <span id="booking-toast-message"></span>
          <button id="booking-undo" type="button" hidden>Undo</button>
          <button id="booking-toast-close" type="button" aria-label="Dismiss">×</button>
        </div>

        <dialog id="booking-drawer" class="room-status-dialog">
          <div class="dialog-heading">
            <h2 id="booking-drawer-title">Booking</h2>
            <button type="button" class="dialog-close" data-close-dialog="booking-drawer" aria-label="Close">×</button>
          </div>
          <div id="booking-drawer-content"></div>
        </dialog>
      </main>
    </div>

    <script src="../js/local-auth.js"></script>
    <script src="../js/local-admin.js"></script>
    <script src="../js/booking-drawer.js"></script>
    <script src="../js/booking-view-rules.js"></script>
    <script src="../js/bookings.js"></script>
  </body>
</html>
