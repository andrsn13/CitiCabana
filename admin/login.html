<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Citi Cabana</title>
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body class="login-body">
    <div class="login-split">
      <!-- Left Pane: Branding -->
      <div
        class="login-image"
        style="background-image: url(&quot;/images/hero.jpg&quot;)"
      >
        <div class="login-image-overlay">
          <h1 class="login-brand-title">Citi Cabana</h1>
          <p class="login-brand-subtitle">Management Portal</p>
        </div>
      </div>

      <!-- Right Pane: Forms -->
      <div class="login-content">
        <a href="../index.html" class="return-link"
          >&larr; Return to Public Website</a
        >

        <div class="auth-card">
          <!-- Form 1: SIGN IN -->
          <div id="view-signin" class="auth-view">
            <h2>Sign In</h2>
            <p class="auth-subtitle" id="auth-subtitle">
              Welcome back. Please enter your details.
            </p>
            <div id="login-error" class="error-msg hidden" role="alert"></div>

            <form id="login-form">
              <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" required />
              </div>
              <div class="form-group">
                <label for="login-password">Password</label>
                <div class="password-wrapper">
                  <input
                    type="password"
                    id="login-password"
                    required
                    autocomplete="current-password"
                  />
                  <button
                    type="button"
                    class="pwd-toggle"
                    onclick="togglePwd('login-password')"
                  >
                    Show
                  </button>
                </div>
              </div>
              <button type="submit" class="btn btn-primary btn-block">
                <span id="login-submit-label">Sign In</span>
              </button>
            </form>

            <div class="auth-footer" style="padding-bottom: 24px"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="../js/local-auth.js"></script>

    <script>
      function togglePwd(inputId) {
        const input = document.getElementById(inputId);
        const btn = input.nextElementSibling;
        if (input.type === "password") {
          input.type = "text";
          btn.textContent = "Hide";
        } else {
          input.type = "password";
          btn.textContent = "Show";
        }
      }
    </script>
  </body>
</html>
